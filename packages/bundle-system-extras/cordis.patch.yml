# The dsh-system-extras bundle patch: adds the right network panel and the
# bottom-left filesystem browser. Both panels consume the systemMetrics
# `overview`/`listDirectory` remotes — the namespace is mounted and the host
# row is inserted by the dsh-system-panel bundle, so this layer installs
# alongside it. The bottom-right cell stays empty (no keyboard occupant).
# Purely additive — nothing in the default surface is disabled.
- insert:
    - id: ui-network-panel
      name: '@deepseek-ai/dsh-client-ui-network-panel'

    - id: ui-files-browser
      name: '@deepseek-ai/dsh-client-ui-files-browser'
